[workspace]
resolver = "2"
members = [
    "crates/disklens-core",
    "crates/disklens-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.30"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# 开发时也让扫描核心保持较快速度
[profile.dev.package.disklens-core]
opt-level = 2
